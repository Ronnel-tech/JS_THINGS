<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css" />
  </head>
  <body class="p-60 pl-80 pr-80 bg-[#030712]">
    <div
      class="flex flex-col gap-5 align-center justify-center border border-[#1c2029] rounded-md shadow-sm bg-[#1c2029] p-30 m-5"
    >
      <form
        id="nameForm"
        class="flex flex-col gap-3 align-center justify-center"
      >
        <label
          for="timeInput"
          class="text-white text-lg font-medium text-center"
          >How much time do you have?</label
        >
        <input
          type="text"
          id="nameInput"
          class="border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
        />
        <button
          type="submit"
          class="mt-4 bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Check Time
        </button>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
