<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../src/output.css">
    <title>Document</title>
</head>
<body>
<form action="" class="flex flex-col gap-4 w-sm" id="myForm">
    <label for="name">Name
        <input id="name" type="text" placeholder="Enter your name"  class="bg-amber-100 rounded-2xl p-2" >
    </label>

    <label for="age">Age
        <input id="age"
               type="text"
               placeholder="Enter your age"
               class="bg-amber-100 rounded-2xl p-2" >
    </label>

    <label for="gender">Gender
        <input id="gender"
               type="text"
               placeholder="Enter your gender"
               class="bg-amber-100 rounded-2xl p-2" >
    </label>

    <label for="id">ID
        <input
                id="id"
                type="text"
                placeholder="Enter your id"
                class="bg-amber-100 rounded-2xl p-2" >
    </label>

    <button
            type="submit"
            class="bg-amber-100 rounded-2xl p-2">Submit</button>
</form>
<script src="app.js"></script>
</body>
</html>
