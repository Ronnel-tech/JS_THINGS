<section id="weather" aria-live="polite">
    <div id="weather-data" hidden>
        <h2>Current weather</h2>
        <p id="weather-status">Loading weather...</p>
        <p>Location: <span id="weather-location"></span></p>
        <p>Temperature: <span id="weather-temperature"></span></p>
        <p>Condition: <span id="weather-condition"></span></p>
        <p>Humidity: <span id="weather-humidity"></span></p>
        <p>Wind speed: <span id="weather-wind"></span></p>


    </div>
    <button id="weather-button" class="p-5 bg-amber-600 rounded-4xl">Get Weather</button>
</section>
