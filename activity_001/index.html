<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Event Handling Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="header">Advanced Event Handling Lab</h1>
    <p id="paragraph">This paragraph is ready to be updated.</p>

    <div id="outer">
      <h2>Outer</h2>

      <div id="middle">
        <h2>Middle</h2>

        <div id="inner">
          <h2>Inner</h2>

          <button id="changeTextBtn">Change Text</button>
          <button id="specialBtn">Special Action</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <a id="myLink" href="https://google.com">Go to Google</a>

      <form id="myForm">
        <label for="msgInput">Message</label>
        <input type="text" id="msgInput" placeholder="Enter a message" />
        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
